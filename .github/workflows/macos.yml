name: macOS

# macOS is checked in its own workflow, apart from CI, and "macOS passed" means mcp-proof works on a real Mac: every job
# runs the stand-in client, runs the Action from the packed tarball and starts the REAL Claude Code client against the test
# server. GitHub's free macOS runners are often not assigned at all (the job then sits queued and is cancelled with "not
# acquired by Runner of type hosted", having run no step), and a shortage is not a test failure, so this workflow never runs
# on pushes to main (a cancelled run would put a red cross on main) and CI stays red only for what actually ran and failed.
#
# Runs on pull requests, on a v* tag, weekly and by hand. Explicit labels, never `macos-latest` (it is macos-26-arm64, the
# label cancelled most): Intel macos-15-intel (x64) and Apple silicon macos-15 (arm64) on Node 22; on a v* tag, or by hand with
# full = true, Node 24 is checked as well.
#
# The ONE required check is "macOS result" (the last job), which runs on an ordinary Linux runner so it always starts:
#   - a macOS job that ran and FAILED  -> "macOS result" fails and the merge is blocked;
#   - no macOS job ran (no runner)     -> it passes with a loud warning and a job summary saying macOS was NOT verified,
#                                         so a runner shortage never forces an administrator override;
#   - some passed, some did not run    -> it passes and lists what did not run (a job skipped on purpose is not a gap).
# Logic and tests: scripts/macos-gate.mjs, src/macosGate.test.ts. If you rename "macOS result", update the required checks
# of main too, or pull requests will wait for a check that never appears.
# Re-run a cancelled run by hand, later; never in a loop.
on:
  pull_request:
  push:
    tags: ["v*"]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      full:
        description: Also run the checks on Node 24
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS ${{ matrix.arch }} (Node 22)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15-intel, arch: x64 }
          - { os: macos-15, arch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Which machine this is
        run: uname -m && sw_vers
      - run: npm install --global pnpm@10
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: The stand-in client verifies the test server
        if: ${{ !cancelled() }}
        run: node dist/main.js run --client standin --out proof -- node test/fixtures/echo-server.mjs && node dist/main.js validate proof/compat.json
      - name: Pack the tarball
        id: pack
        if: ${{ !cancelled() }}
        run: |
          name=$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" | tail -n 1)
          echo "tgz=$RUNNER_TEMP/$name" >> "$GITHUB_OUTPUT"
      - name: Run the Action from the tarball
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        uses: ./
        with:
          server: node test/fixtures/echo-server.mjs
          clients: standin
          out: action-out
          package: ${{ steps.pack.outputs.tgz }}
      - name: The Action wrote a valid record
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        run: node dist/main.js validate action-out/compat.json
      - name: Install the real client
        if: ${{ !cancelled() }}
        run: npm install --global @anthropic-ai/claude-code@2.1.317
      - name: Claude Code starts the test server
        if: ${{ !cancelled() }}
        run: node dist/main.js run --client claude-code --out real-proof -- node test/fixtures/echo-server.mjs && node dist/main.js validate real-proof/compat.json

  macos-node24:
    name: macOS x64 (Node 24)
    if: ${{ inputs.full || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Which machine this is
        run: uname -m && sw_vers
      - run: npm install --global pnpm@10
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  # The required check. Runs on Linux, so it always starts, and decides from what the macOS jobs above really did.
  result:
    name: macOS result
    needs: [macos, macos-node24]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: What the macOS jobs did
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs" \
            --paginate --jq '.jobs[] | {name: .name, conclusion: .conclusion}' > jobs.ndjson
          node scripts/macos-gate.mjs jobs.ndjson
